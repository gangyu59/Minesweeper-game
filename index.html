<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💣 扫雷</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="main.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
            .then(() => console.log('Service Worker Registered'))
            .catch(error => console.error('Service Worker Registration failed:', error));
        }
    </script>
</head>
<body>
    <div class="game-wrapper">
        <header class="game-header">
            <h1 class="game-title">💣 扫雷</h1>
            <div class="game-stats">
                <div class="stat-box">
                    <span class="stat-icon">💣</span>
                    <span class="stat-value" id="mine-count">8</span>
                </div>
                <div class="stat-box timer-box">
                    <span class="stat-icon">⏱</span>
                    <span class="stat-value" id="timer">0</span>
                </div>
            </div>
        </header>

        <div id="game-container">
            <canvas id="game-canvas"></canvas>
        </div>

        <div id="message"></div>

        <div id="controls">
            <div class="difficulty-section">
                <label for="difficulty-slider">
                    难度：<span id="difficulty-label">超易</span>
                </label>
                <input type="range" id="difficulty-slider" class="slider" min="1" max="5" value="1">
                <div class="difficulty-dots">
                    <span>超易</span>
                    <span>较易</span>
                    <span>中等</span>
                    <span>较难</span>
                    <span>超难</span>
                </div>
            </div>
            <div class="button-row">
                <button id="start-button" class="btn btn-start">🚀 开始</button>
                <button id="rules-button" class="btn btn-rules">📖 规则</button>
            </div>
        </div>
    </div>

    <div id="rules-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>🎮 游戏规则</h2>
            <ul>
                <li>👆 点击格子揭开它</li>
                <li>🔢 数字表示邻近地雷数量</li>
                <li>💥 点击地雷，游戏结束</li>
                <li>🏆 揭开所有非雷格子获胜！</li>
            </ul>
        </div>
    </div>

    <script>
        const modal = document.getElementById("rules-modal");
        const btn = document.getElementById("rules-button");
        const span = document.getElementsByClassName("close-button")[0];

        btn.onclick = function() { modal.style.display = "flex"; }
        span.onclick = function() { modal.style.display = "none"; }
        window.onclick = function(event) {
            if (event.target == modal) modal.style.display = "none";
        }
    </script>
</body>
</html>
